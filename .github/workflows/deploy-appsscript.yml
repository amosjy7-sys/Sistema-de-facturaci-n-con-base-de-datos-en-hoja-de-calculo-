name: 📱 Auto Deploy a Google Apps Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Setup Google Auth
        run: echo '${{ secrets.CLASP_AUTH }}' > ~/.clasprc.json

      - name: Deploy to Apps Script
        run: |
          clasp push --force

      - name: Success Message
        run: echo "✅ Código deployado a Google Apps Script"
